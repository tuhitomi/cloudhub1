name: Local validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: python scripts/check_team_ownership.py
      - run: python scripts/check_local.py
      - name: TV4 release-tool unit tests
        run: python -m unittest discover -s tests -p test_tv4_release_tools.py -v
      - run: python -m pip install -r requirements-dev.txt
      - name: TV4 integration regressions or explicit dependency blocker
        run: python scripts/check_tv4.py --allow-missing-dependencies --out "${{ runner.temp }}/tv4-integration.json"
