name: Local validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: python scripts/check_team_ownership.py
      - run: python scripts/check_local.py
      - run: python -m pip install -r requirements-dev.txt
      - name: TV4 repository regressions (missing modules fail)
        run: python scripts/check_tv4.py --out "${{ runner.temp }}/tv4-integration.json"
      - name: Full Python, frontend, OpenAPI and IaC validation (no AWS)
        run: python scripts/check_product_release.py --out "${{ runner.temp }}/main-integration.json"
      - name: Save local validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-validation-results
          path: |
            ${{ runner.temp }}/tv4-integration.json
            ${{ runner.temp }}/main-integration.json
          if-no-files-found: warn
