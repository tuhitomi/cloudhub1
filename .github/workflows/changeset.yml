name: Propose AWS change set
# Manual only. Validates the commit, packages the backend and creates a
# CloudFormation change set through GitHub OIDC (no stored AWS keys).
# The role cannot execute change sets: a person reviews and executes it.
on:
  workflow_dispatch:
    inputs:
      stack_name:
        description: Existing control-plane stack name
        required: true
        default: cloudhub
permissions:
  contents: read
  id-token: write
concurrency:
  group: changeset-${{ inputs.stack_name }}
  cancel-in-progress: false
jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: aws-changeset
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      ARTIFACT_BUCKET: ${{ vars.CLOUDHUB_ARTIFACT_BUCKET }}
      STACK_NAME: ${{ inputs.stack_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r requirements-dev.txt
      - name: Full local validation before touching AWS
        run: python scripts/check_product_release.py --out "${{ runner.temp }}/release-checks.json"
      - name: Template must match the committed generator output
        run: |
          python scripts/generate_infra.py --out "${{ runner.temp }}/control-plane.json"
          python scripts/compare_json.py infra/control-plane.json "${{ runner.temp }}/control-plane.json"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CHANGESET_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: cloudhub-changeset-${{ github.run_id }}
      - name: Package backend and create change set (not executed)
        run: |
          aws cloudformation package --template-file infra/control-plane.json \
            --s3-bucket "$ARTIFACT_BUCKET" --s3-prefix "ci/${GITHUB_SHA}" \
            --output-template-file "${RUNNER_TEMP}/packaged.json" --use-json
          aws cloudformation deploy --template-file "${RUNNER_TEMP}/packaged.json" \
            --stack-name "$STACK_NAME" --no-execute-changeset \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
            --tags "cloudhub:commit=${GITHUB_SHA}"
      - name: Summarize proposed changes
        run: |
          set -o pipefail
          id=$(aws cloudformation list-change-sets --stack-name "$STACK_NAME" \
            --query "reverse(sort_by(Summaries,&CreationTime))[0].ChangeSetId" --output text)
          {
            echo "### Change set for \`$STACK_NAME\` at \`${GITHUB_SHA::7}\`"
            echo
            echo "| Action | Logical ID | Type | Replacement |"
            echo "|---|---|---|---|"
            aws cloudformation describe-change-set --change-set-name "$id" \
              --query "Changes[].ResourceChange.[Action,LogicalResourceId,ResourceType,Replacement]" --output text \
              | awk -F'\t' '{print "| "$1" | "$2" | "$3" | "$4" |"}'
            echo
            echo "Review, then execute in the console or with: \`aws cloudformation execute-change-set --change-set-name $id\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: changeset-${{ github.run_id }}
          path: ${{ runner.temp }}/release-checks.json
          if-no-files-found: warn
